version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env   # contains ATLAS_URI and PORT

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: "http://localhost:5000"  # <-- dev default; change for prod
    ports:
      - "3000:80"
    depends_on:
      - backend